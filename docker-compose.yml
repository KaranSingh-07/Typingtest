services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN}
      EVENT_NAME: ${EVENT_NAME:-Freshers' Orientation}
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - typeflow-data:/data
    restart: unless-stopped

volumes:
  typeflow-data:
