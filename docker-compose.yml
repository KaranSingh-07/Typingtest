version: '3.8'
services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: typing_user
      POSTGRES_PASSWORD: typing_password
      POSTGRES_DB: typing_test
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
